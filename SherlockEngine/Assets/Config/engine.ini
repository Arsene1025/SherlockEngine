; SherlockEngine 설정 (10단계). exe 옆 Assets\Config\engine.ini 로 복사됨.
; 실행 인자 --backend=, --scene= 가 여기 값을 덮어씀. 키는 대소문자를 가리지 않음.

[engine]
backend = d3d11        ; d3d11 | d3d12  — 이 값만 바꿔 백엔드를 고름 (10단계 완료 기준)
width = 1280
height = 720
vsync = false
debuglayer = true      ; Debug 빌드에서만 실제로 켜짐
scene = demo           ; demo | helmet | sponza
fixedstep = 0.0166667  ; 고정 스텝(초). OnFixedUpdate 주기

[game]
; 11-D단계: 게임 런타임(SherlockGame.exe)이 읽음. 에디터의 File > Build Game... 이 빌드 폴더의 사본에 이 값을 채워 넣음.
startScene = demo_components.json   ; Assets\Scenes 기준 파일명 (또는 절대 경로)
title = Sherlock Game

[log]
level = info           ; debug | info | warn | error — 이 레벨 미만은 어디에도 출력되지 않음
file = Logs\SherlockEngine.log   ; exe 기준 상대 경로. 비우면 파일 싱크 없음
console = true         ; 콘솔 싱크. 명령줄에서 실행하면 부모 콘솔에 붙음
allocConsole = false   ; true 면 콘솔이 없을 때 검은 콘솔 창을 새로 엶 (10단계의 Debug 동작). 에디터의 Console 창(F12)과 로그 파일이 있어 기본은 끔
