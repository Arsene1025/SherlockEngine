; SherlockEngine 설정 (10단계). exe 옆 Assets\Config\engine.ini 로 복사된다.
; 실행 인자 --backend=, --scene= 가 여기 값을 덮어쓴다. 키는 대소문자를 가리지 않는다.

[engine]
backend = d3d11        ; d3d11 | d3d12  — 이 값만 바꿔 백엔드를 고른다 (10단계 완료 기준)
width = 1280
height = 720
vsync = false
debuglayer = true      ; Debug 빌드에서만 실제로 켜진다
scene = demo           ; demo | helmet | sponza
fixedstep = 0.0166667  ; 고정 스텝(초). OnFixedUpdate 주기

[log]
level = info           ; debug | info | warn | error — 이 레벨 미만은 어디에도 나가지 않는다
file = Logs\SherlockEngine.log   ; exe 기준 상대 경로. 비우면 파일 싱크 없음
console = true         ; 콘솔 싱크. 부모 콘솔에 붙고, Debug 빌드에서는 없으면 새로 연다
